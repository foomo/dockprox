name: Releases Tag

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # https://github.com/sigstore/cosign-installer/releases
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # https://github.com/jdx/mise-action/releases
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      # https://github.com/actions/setup-go/releases
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: go.mod

      # https://github.com/docker/setup-qemu-action/releases
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # https://github.com/docker/setup-buildx-action/releases
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # https://github.com/tibdex/github-app-token/releases
      - id: app_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.TOKEN_APP_ID }}
          private_key: ${{ secrets.TOKEN_APP_PRIVATE_KEY }}

      - name: Login to docker.io
        run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

      # https://github.com/goreleaser/goreleaser-action/releases
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}

  release-menubar:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # https://github.com/actions/setup-go/releases
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version-file: go.mod

      # https://github.com/tibdex/github-app-token/releases
      - id: app_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.TOKEN_APP_ID }}
          private_key: ${{ secrets.TOKEN_APP_PRIVATE_KEY }}

      - name: Build .app bundles
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          mkdir -p dist
          for ARCH in arm64 amd64; do
            APP="dist/Dockprox.app"
            rm -rf "$APP"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            sed "s/__VERSION__/${V}/g" cmd/dockprox-menubar/Info.plist > "$APP/Contents/Info.plist"
            iconutil -c icns cmd/dockprox-menubar/icon.iconset -o "$APP/Contents/Resources/icon.icns"
            CARCH="${ARCH}"
            [ "$ARCH" = "amd64" ] && CARCH="x86_64"
            CGO_ENABLED=1 \
            CGO_CFLAGS="-arch ${CARCH}" \
            CGO_LDFLAGS="-arch ${CARCH}" \
            GOOS=darwin GOARCH="${ARCH}" \
              go build -tags=safe -trimpath \
              -ldflags="-s -w -X github.com/foomo/dockprox/internal/menubar.version=${V}" \
              -o "$APP/Contents/MacOS/dockprox-menubar" ./cmd/dockprox-menubar
            # TODO: ad-hoc signing only, unsigned for Gatekeeper on other
            # machines. Swap for `codesign --sign "Developer ID Application: ..."
            # --options runtime --timestamp` + notarytool once a cert exists.
            codesign --force --deep --sign - "$APP"
            ditto -c -k --keepParent "$APP" "dist/dockprox-menubar_${V}_darwin_${ARCH}.zip"
          done

      - name: Upload to release
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/dockprox-menubar_*_darwin_*.zip --clobber

      - name: Update Homebrew cask
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          SHA_ARM64=$(shasum -a 256 "dist/dockprox-menubar_${V}_darwin_arm64.zip" | cut -d' ' -f1)
          SHA_AMD64=$(shasum -a 256 "dist/dockprox-menubar_${V}_darwin_amd64.zip" | cut -d' ' -f1)

          cat > dockprox-menubar.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          cask "dockprox-menubar" do
            arch arm: "arm64", intel: "amd64"

            version "${V}"
            sha256 arm:   "${SHA_ARM64}",
                    intel: "${SHA_AMD64}"

            url "https://github.com/foomo/dockprox/releases/download/v#{version}/dockprox-menubar_#{version}_darwin_#{arch}.zip"
            name "dockprox"
            desc "Menu bar app for dockprox, an inverse HTTP(S) proxy with SOCKS5 support"
            homepage "https://github.com/foomo/dockprox"

            depends_on macos: :big_sur

            app "Dockprox.app"

            zap trash: [
              "~/Library/Preferences/com.foomo.dockprox.plist",
            ]
          end
          EOF

          git clone "https://x-access-token:${GH_TOKEN}@github.com/foomo/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp dockprox-menubar.rb tap/Casks/dockprox-menubar.rb
          cd tap
          git config user.name "foomo-bot"
          git config user.email "bot@foomo.org"
          git add Casks/dockprox-menubar.rb
          git diff --cached --quiet || git commit -m "chore: update dockprox-menubar to ${V}"
          git push
