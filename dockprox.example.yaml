# yaml-language-server: $schema=./dockprox.schema.json
#
# Example dockprox configuration. Every field in pkg/config.Config is
# documented here — see dockprox.schema.json for the authoritative schema
# (regenerate via `make generate` after changing pkg/config types).

# Config format version. Required; must be 1.
version: 1

# Local proxy listen address (host:port). Clients point their HTTP(S)
# proxy settings here.
listen: 127.0.0.1:8888

# debug | info | warn | error. Defaults to "info".
logLevel: info

# Log file path (used by both `dockprox serve` and the menubar app; serve
# also mirrors output to stderr). Empty (default) uses the OS cache dir
# (e.g. ~/Library/Caches/dockprox/dockprox.log on macOS).
logFile: ""

# Named upstreams that rules below can route matched hosts through.
# Requests to unmatched hosts always dial direct.
upstreams:
  # SOCKS5 upstream, e.g. an SSH -D tunnel or a corporate SOCKS5 jump host.
  jump:
    type: socks5
    addr: 127.0.0.1:1080          # host:port, required for type: socks5
    dns: remote                   # local (default) | remote (socks5h-style remote DNS)
    auth:                         # optional RFC 1929 username/password
      username: user
      password: pass

  # HTTP CONNECT upstream, e.g. a corporate HTTP(S) proxy.
  corp:
    type: http
    url: https://proxy.example.com:3128 # required for type: http
    auth:                                # optional HTTP Basic auth
      username: user
      password: pass
    tls:                                 # optional, only used when url is https://
      insecureSkipVerify: false
      caFile: /path/to/ca.pem

  # Direct upstream: dials the target directly from the local host. No
  # additional fields required.
  direct:
    type: direct

  # Forward upstream: ignores the requested target and always dials addr.
  # The client's hostname still travels in the TLS SNI and the Host
  # header, so a vhost-routing backend (ingress controller, reverse
  # proxy) sees the original name while the connection lands elsewhere.
  # Useful for reaching a local k3d/kind cluster published on a
  # non-standard port without putting that port in the URL.
  cluster-a:
    type: forward
    addr: 127.0.0.1:10310         # host:port, required for type: forward

  # SSH tunnel. dockprox opens the SSH connection itself (lazily, on first
  # use) and exposes it as a rule target and/or a local SOCKS5 port.
  bastion:
    type: ssh
    host: bastion.example.com     # required for type: ssh
    port: 22                      # optional, default 22
    user: deploy                  # optional, default: current OS user
    keyFile: ~/.ssh/id_ed25519    # key auth; or identityAgent, or both
    keyFilePassphrase: ""         # optional, for an encrypted keyFile
    identityAgent: SSH_AUTH_SOCK  # agent auth: this sentinel, or a socket path
    # Pinned host key fingerprint. Omit to fall back to ~/.ssh/known_hosts.
    #   ssh-keyscan -t ed25519 bastion.example.com 2>/dev/null \
    #     | ssh-keygen -lf - | awk '{print $2}'
    hostKey: "SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    via: vpn                      # optional: dial the bastion through another (non-ssh) upstream

  # OpenConnect VPN, run rootless: dockprox spawns
  #   openconnect --script-tun --script "ocproxy -D <port>"
  # on first use, so the VPN is reachable only through dockprox — no tun
  # device, no system routes, no sudo. Requires `brew install openconnect
  # ocproxy`. Connecting waits up to 90s for MFA (e.g. a push approval).
  vpn:
    type: openconnect
    server: https://vpn.example.com # required, https://
    protocol: f5                    # f5 (default) | anyconnect | nc | gp | pulse | fortinet | array
    auth:                           # required: login user; password sent on stdin
      username: user
      password: pass
    serverCert: pin-sha256:AAAA...  # optional: pin the gateway certificate (--servercert)
    # Kernel tun instead of ocproxy: runs `sudo -n openconnect`, so the VPN's
    # routes and DNS apply system-wide while connected. Needs a sudoers line
    # (dockprox prints it at startup): user ALL=(root) NOPASSWD: openconnect, kill
    tun: false

# Local ports besides the HTTP proxy: SOCKS5 servers, for tools that speak
# SOCKS5 rather than HTTPS_PROXY, and plain TCP forwards. Optional.
listeners:
  # Pinned: every connection goes through this upstream; rules are ignored.
  - listen: 127.0.0.1:1080
    upstream: bastion
  # No upstream: routes by the rules below, like the HTTP proxy;
  # unmatched hosts dial direct.
  - listen: 127.0.0.1:1090
    type: socks5                  # socks5 (default) | tcp
  # tcp: a plain port forward like `ssh -L` — every connection goes to
  # target, through upstream (or routed by rules on target's host when
  # upstream is omitted). Clients need no proxy support.
  - type: tcp
    listen: 127.0.0.1:5432
    target: db.internal.example.com:5432
    upstream: bastion

# Host-matching rules, evaluated in order. match is either an exact
# hostname or a leading "*." wildcard suffix. upstream must name an entry
# from upstreams above.
rules:
  - match: "*.azurecr.io"
    upstream: jump
  - match: proxy.internal.example.com
    upstream: corp
  - match: "*.internal.example.com"
    upstream: bastion
  - match: "*.a.local.gd"
    upstream: cluster-a

# Isolated Chrome instance launched from the macOS menu bar app
# ("Open Chrome"), pointed at the listen address above. It uses its own
# profile under ~/Library/Application Support/dockprox/chrome, so it never
# touches your own Chrome profile. Optional — omit for the defaults.
chrome:
  # Which browser to launch, as accepted by `open -a`: an app name, a
  # bundle ID (com.google.Chrome), or an .app path. Default: Google Chrome.
  # dockprox launches via `open` rather than executing the binary inside
  # the .app, so macOS does not ask for App Management permission.
  app: Google Chrome
  # Extra flags, appended after the proxy and profile flags (so they win).
  flags:
    - --incognito
    - --window-size=1280,800
